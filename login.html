<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#071747" />
  <title>Portal Login | Elpis Property Limited</title>
  <link rel="preload" href="assets/fonts/fc88c23021-rP2Hp2ywxg089UriCZOIHTWEBlw.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/fonts/f2edea8e97-xn7gYHE41ni1AdIRggexSvfedN4.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="assets/fonts/fonts.css">
  <link rel="stylesheet" href="assets/css/styles.css">
  <style>
    body {
      background-color: var(--brand-background);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 30px 16px;
    }
    .login-box {
      width: 100%;
      max-width: 420px;
      background: #ffffff;
      border: 1px solid var(--brand-line);
      border-radius: var(--radius-md);
      padding: 36px 32px;
      box-shadow: var(--shadow-md);
    }
    .login-header {
      text-align: center;
      margin-bottom: 26px;
    }
    .login-logo {
      width: 175px;
      height: auto;
      margin: 0 auto 16px;
      display: block;
    }
    .login-title {
      font-size: 24px;
      font-weight: 800;
      color: var(--brand-text);
    }
    .login-subtitle {
      font-size: 13px;
      color: var(--brand-muted);
      margin-top: 4px;
    }
    .login-form {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .login-form .form-group input {
      width: 100%;
      height: 46px;
      padding: 0 14px;
      border: 1px solid var(--brand-line);
      border-radius: var(--radius-sm);
      font-size: 14px;
    }
    .login-links {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      margin-top: 4px;
    }
    .login-links a {
      color: var(--brand-primary-dark);
      font-weight: 600;
    }
    .back-home-link {
      margin-top: 24px;
      font-size: 13px;
      color: var(--brand-muted);
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .back-home-link:hover {
      color: var(--brand-primary-dark);
    }
  </style>
  <link rel="stylesheet" href="assets/css/motion.css">
  <script src="assets/js/intro-config.js"></script>
  <script src="assets/js/motion.js"></script>
  <link rel="manifest" href="manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Elpis Property">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="assets/icons/icon-192.png">
</head>
<body>
  <div class="login-box">
    <div class="login-header">
      <a href="index.html">
        <img src="assets/images/elpis-property-logo-original.png" alt="Elpis Property Limited Logo" class="login-logo" onerror="this.src='elpis-property-logo-original.png'">
      </a>
      <h1 class="login-title">Portal Sign In</h1>
      <p class="login-subtitle">Access your client account or staff management portal</p>
    </div>

    <form class="login-form" id="loginForm">
      <div class="form-group">
        <label for="email" style="font-size:12px;font-weight:600;color:var(--brand-text)">Email Address</label>
        <input type="email" id="email" placeholder="name@company.com" required>
      </div>

      <div class="form-group">
        <label for="password" style="font-size:12px;font-weight:600;color:var(--brand-text)">Password</label>
        <input type="password" id="password" placeholder="••••••••" required>
      </div>

      <div class="login-links">
        <a href="signup.html">Create client account</a>
        <a href="forgot-password.html">Forgot password?</a>
      </div>

      <button class="btn btn-brand btn-block" type="submit" id="submitBtn">Sign In to Account</button>
      <div id="msg" style="color:#c0392b;font-size:13px;text-align:center;min-height:18px"></div>
    </form>
  </div>

  <a href="index.html" class="back-home-link">← Return to Homepage</a>

  <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const msg = document.getElementById('msg');
      const submitBtn = document.getElementById('submitBtn');
      msg.textContent = '';
      submitBtn.disabled = true;
      submitBtn.textContent = 'Authenticating...';

      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            email: document.getElementById('email').value,
            password: document.getElementById('password').value
          })
        });
        const data = await res.json();
        if (!res.ok) {
          msg.textContent = data.error || 'Login failed. Please check credentials.';
          submitBtn.disabled = false;
          submitBtn.textContent = 'Sign In to Account';
          return;
        }
        const me = await fetch('/api/me').then(r => r.json());
        const role = me.actual_role || me.role_name || me.role || '';
        const landing = {
          'Customer Care': '/customer-care.html',
          'Sub Admin': '/sub-admin-dashboard.html',
          'GSM': '/gsm-dashboard.html',
          'Accountant': '/accountant-dashboard.html'
        }[role] || `/dashboard.html?role=${encodeURIComponent(me.role_name || me.role || '')}`;
        window.location.href = landing;
      } catch (err) {
        msg.textContent = 'Server is currently offline. Management portal will be enabled in Phase 2.';
        submitBtn.disabled = false;
        submitBtn.textContent = 'Sign In to Account';
      }
    });
  </script>
  <script src="assets/js/mobile-nav.js"></script>
  <script src="assets/js/pwa.js"></script>
  <script src="assets/js/password-toggle.js"></script>
  <script type="module" src="assets/js/digital-human/index.js"></script>
</body>
</html>
