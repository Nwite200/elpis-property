name = "elpis-property"
main = "src/index.js"
compatibility_date = "2024-11-01"
workers_dev = true
preview_urls = false

[assets]
directory = "./"
binding = "ASSETS"
run_worker_first = true

# Elpis staging resources. Replace the D1 and KV placeholders with IDs
# created inside Elpis Property Limited's Cloudflare account before deploying.
[[d1_databases]]
binding = "DB"
database_name = "elpis-property-staging-db"
# LOCAL-ONLY PLACEHOLDER. Replace with the D1 UUID created in Elpis Cloudflare before any remote deploy.
database_id = "00000000-0000-4000-8000-000000000001"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "FILES"
bucket_name = "elpis-property-staging-files"

[[kv_namespaces]]
binding = "CACHE"
# LOCAL-ONLY PLACEHOLDER. Replace with the KV namespace ID created in Elpis Cloudflare before any remote deploy.
id = "00000000000000000000000000000001"

[[queues.producers]]
binding = "TASKS"
queue = "elpis-property-staging-tasks"

[[queues.consumers]]
queue = "elpis-property-staging-tasks"
max_batch_size = 10
max_batch_timeout = 5
max_retries = 5

[[durable_objects.bindings]]
name = "CHAT_ROOM"
class_name = "ChatRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ChatRoom"]

[triggers]
crons = ["0 6 * * *"]

[vars]
ENVIRONMENT = "staging"
DEMO_MODE_ENABLED = "0"
DEFAULT_GRACE_DAYS = "0"
PAYMENT_MODE = "test"

[observability]
enabled = true
