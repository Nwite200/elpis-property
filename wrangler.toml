name = "elpis-property"
main = "src/index.js"
compatibility_date = "2024-11-01"
workers_dev = true
preview_urls = false

[assets]
directory = "./"
binding = "ASSETS"
run_worker_first = true

# Elpis staging resources. Replace the D1 and KV placeholders with IDs
# created inside Elpis Property Limited's Cloudflare account before deploying.
[[d1_databases]]
binding = "DB"
database_name = "elpis-property-staging-db"
# D1 database created in Elpis Property's Cloudflare account.
database_id = "0cec58fd-dd43-462a-b974-9b6b9231a950"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "FILES"
bucket_name = "elpis-property-staging-files"

[[kv_namespaces]]
binding = "CACHE"
# KV namespace created in Elpis Property's Cloudflare account.
id = "c76c15d9dc574f9cace3398d82d30c18"

[ai]
binding = "AI"

[[queues.producers]]
binding = "TASKS"
queue = "elpis-property-staging-tasks"

[[queues.consumers]]
queue = "elpis-property-staging-tasks"
max_batch_size = 10
max_batch_timeout = 5
max_retries = 5

[[durable_objects.bindings]]
name = "CHAT_ROOM"
class_name = "ChatRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ChatRoom"]

[triggers]
crons = ["0 6 * * *"]

[vars]
ENVIRONMENT = "staging"
DEMO_MODE_ENABLED = "0"
DEFAULT_GRACE_DAYS = "0"
PAYMENT_MODE = "test"
# Rollback: change to "safe" to restore revalidate-every-time asset caching.
ASSET_CACHE_MODE = "standard"
# Performance flags. One-line rollback for each: set to "0" and redeploy.
PERF_BATCH_QUERIES = "1"
PERF_SARGABLE_DATES = "1"

[observability]
enabled = true
