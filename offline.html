<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#071747" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Elpis Property" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png" />
  <link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32.png" />
  <link rel="preload" href="assets/fonts/fc88c23021-rP2Hp2ywxg089UriCZOIHTWEBlw.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="assets/fonts/fonts.css" />
  <link rel="stylesheet" href="assets/css/motion.css" />
  <script src="assets/js/intro-config.js"></script>
  <script src="assets/js/motion.js"></script>
  <title>Offline | Elpis Property Limited</title>
  <style>
    :root { --brand-primary:#071747; --brand-secondary:#E8B52D; --brand-text:#26344F; --brand-background:#F7F6F2; --brand-line:#E3E1D8; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      padding: 24px; background: radial-gradient(circle at 50% 35%, #fff, var(--brand-background));
      color: var(--brand-text); font-family: "DM Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .card {
      width: min(100%, 460px); background: #fff; border: 1px solid var(--brand-line);
      border-radius: 18px; padding: 32px 26px; text-align: center;
      box-shadow: 0 20px 60px rgba(7,23,71,.10);
    }
    .logo { width: min(280px, 76vw); height: auto; display: block; margin: 0 auto 22px; }
    h1 { font-size: 23px; margin: 0 0 10px; letter-spacing: -.02em; }
    p { font-size: 14px; line-height: 1.7; color: #6b7690; margin: 0 0 20px; }
    .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--brand-primary); margin-right: 7px; }
    button {
      appearance: none; border: 0; border-radius: 10px; background: var(--brand-primary);
      color: #fff; font: inherit; font-weight: 700; padding: 13px 22px; cursor: pointer;
    }
    button:active { transform: translateY(1px); }
    .hint { margin-top: 14px; font-size: 12px; color: #98a0b3; }
  </style>
</head>
<body>
  <main class="card">
    <img class="logo" src="assets/images/elpis-property-logo-original.png" alt="Elpis Property Limited" />
    <h1>You are offline</h1>
    <p><span class="dot"></span>The Elpis Property app is installed, but this page needs a connection to load live property and account information.</p>
    <button type="button" onclick="window.location.reload()">Try again</button>
    <div class="hint">Your saved app remains available on your home screen.</div>
  </main>
  <script src="assets/js/mobile-nav.js"></script>
</body>
</html>
