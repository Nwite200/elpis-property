<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#071747" />
  <title>My Property & Purchase Details | Elpis Property Limited</title>
  <link rel="preload" href="assets/fonts/fc88c23021-rP2Hp2ywxg089UriCZOIHTWEBlw.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/fonts/f2edea8e97-xn7gYHE41ni1AdIRggexSvfedN4.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="assets/fonts/fonts.css">
  <link rel="stylesheet" href="assets/css/styles.css">
  <style>
    .portal-layout {
      display: grid;
      grid-template-columns: 260px 1fr;
      min-height: 100vh;
      background-color: var(--brand-background);
    }
    .portal-sidebar {
      background-color: #071747;
      color: #e9ecf4;
      padding: 28px 20px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .portal-sidebar .brand-logo {
      width: 165px;
      height: auto;
      background-color: #ffffff;
      padding: 6px 10px;
      border-radius: var(--radius-sm);
      margin-bottom: 24px;
      display: block;
    }
    .portal-sidebar .nav-section-title {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: #6b7690;
      margin: 16px 8px 6px;
      font-weight: 700;
    }
    .portal-sidebar a {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 14px;
      border-radius: var(--radius-sm);
      color: #aeb6c8;
      font-size: 13px;
      font-weight: 600;
      transition: var(--transition);
    }
    .portal-sidebar a:hover,
    .portal-sidebar a.active {
      background-color: rgba(232,181,45, 0.15);
      color: #e8b52d;
    }
    .portal-main {
      padding: 32px 40px;
      max-width: 1100px;
    }
    .property-showcase-card {
      background: #ffffff;
      border: 1px solid var(--brand-line);
      border-radius: var(--radius-md);
      overflow: hidden;
      box-shadow: var(--shadow-sm);
      margin-bottom: 30px;
    }
    .showcase-header {
      padding: 24px 30px;
      border-bottom: 1px solid var(--brand-line);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
    }
    .showcase-gallery {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 8px;
      background: #e9ecf4;
      height: 380px;
    }
    .showcase-gallery img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .showcase-body {
      padding: 30px;
    }
    .purchase-parameters-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
      background: var(--brand-background);
      border: 1px solid var(--brand-line);
      padding: 20px;
      border-radius: var(--radius-sm);
      margin-bottom: 24px;
    }
    .param-box span {
      display: block;
      font-size: 11px;
      color: var(--brand-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .param-box strong {
      display: block;
      font-size: 16px;
      color: var(--brand-text);
      margin-top: 4px;
    }
    .param-agreed-price {
      font-size: 20px !important;
      color: var(--brand-primary-dark) !important;
      font-weight: 800;
    }
    @media (max-width: 900px) {
      .portal-layout { grid-template-columns: 1fr; }
      .portal-sidebar { display: none; }
      .showcase-gallery { grid-template-columns: 1fr; height: 260px; }
      .purchase-parameters-grid { grid-template-columns: 1fr 1fr; }
    }
    @media (max-width: 640px) {
      .portal-main { padding: 20px 16px; }
      .purchase-parameters-grid { grid-template-columns: 1fr; }
    }
    .portfolio-page-head { display:flex; justify-content:space-between; align-items:flex-end; gap:20px; margin-bottom:28px; flex-wrap:wrap; }
    .portfolio-page-head h1 { font-size:30px; margin:0 0 6px; }
    .portfolio-page-head p { color:var(--brand-muted); font-size:14px; margin:0; max-width:620px; }
    .portfolio-count { font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:1.5px; color:var(--brand-secondary-deep); border:1px solid var(--brand-line); border-radius:999px; padding:7px 13px; background:#fff; }
    .portfolio-property-card { display:grid; grid-template-columns:280px minmax(0,1fr); background:#fff; border:1px solid var(--brand-line); border-radius:var(--radius-md); overflow:hidden; margin-bottom:20px; box-shadow:var(--shadow-sm); }
    .portfolio-property-media { position:relative; min-height:230px; background:#e9ecf4; }
    .portfolio-property-media img { width:100%; height:100%; object-fit:cover; display:block; }
    .portfolio-property-media .status-badge { position:absolute; top:14px; left:14px; }
    .portfolio-property-body { padding:24px 26px; display:flex; flex-direction:column; justify-content:center; gap:16px; }
    .portfolio-property-head { display:flex; justify-content:space-between; align-items:flex-start; gap:16px; flex-wrap:wrap; }
    .portfolio-property-head h2 { font-size:24px; margin:0 0 4px; }
    .portfolio-property-head p { margin:0; font-size:12px; color:var(--brand-muted); }
    .portfolio-property-metrics { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:12px; }
    .portfolio-property-metrics span { display:block; font-size:10px; text-transform:uppercase; letter-spacing:1px; color:var(--brand-muted); margin-bottom:3px; }
    .portfolio-property-metrics strong { font-size:15px; color:var(--brand-primary); }
    .portfolio-progress-track { height:8px; background:var(--brand-line); border-radius:99px; overflow:hidden; }
    .portfolio-progress-track span { display:block; height:100%; background:var(--brand-secondary); border-radius:99px; }
    .portfolio-property-foot { margin:0; font-size:11px; color:var(--brand-muted); }
    .portfolio-add-card { background:#fff; border:1px solid var(--brand-line); border-radius:var(--radius-md); padding:28px; margin-top:30px; box-shadow:var(--shadow-sm); }
    .portfolio-add-card h2 { font-size:28px; margin:10px 0 6px; }
    .portfolio-add-card > p { color:var(--brand-muted); font-size:13px; max-width:620px; margin:0 0 18px; }
    .portfolio-add-form { display:grid; grid-template-columns:minmax(0,1fr); gap:14px; max-width:640px; }
    .portfolio-add-form .field-group { margin:0; }
    .portfolio-add-form .field-input { width:100%; }
    .portfolio-add-form .btn { justify-self:start; }
    .portfolio-add-form #addPropertyMsg { margin:0; }
    @media(max-width:900px){ .portfolio-property-card{grid-template-columns:1fr} .portfolio-property-media{min-height:220px} }
    @media(max-width:560px){ .portfolio-property-metrics{grid-template-columns:repeat(2,minmax(0,1fr))} .portfolio-property-body{padding:18px} .portfolio-property-head .btn{width:100%;text-align:center} }
    @media(max-width:900px){ .portal-layout{grid-template-columns:minmax(0,1fr)} .portal-main{min-width:0} }
    @media(max-width:560px){ .portfolio-add-card{padding:20px} .portfolio-page-head h1{font-size:26px} }
  </style>
  <link rel="stylesheet" href="assets/css/motion.css">
  <script src="assets/js/intro-config.js"></script>
  <script src="assets/js/motion.js"></script>
  <link rel="manifest" href="manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Elpis Property">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="assets/icons/icon-192.png">
</head>
<body>
  <div class="portal-layout">
    <aside class="portal-sidebar">
      <a href="index.html">
        <img src="assets/images/elpis-property-logo-original.png" alt="Elpis Property" class="brand-logo" onerror="this.src='elpis-property-logo-original.png'">
      </a>
      <span class="nav-section-title">Client Workspace</span>
      <a href="client-dashboard.html">📊 Overview</a>
      <a href="client-property.html" class="active">🏡 My Property</a>
      <a href="client-payments.html">💳 Payment History</a>
      <a href="client-virtual-account.html">🏦 My Virtual Account</a>
      <a href="client-receipts.html">📄 Receipts</a>
      <a href="client-notifications.html">🔔 Notifications</a>
      <a href="client-profile.html">👤 Profile & Security</a>
      <span class="nav-section-title" style="margin-top:auto">Actions</span>
      <a href="index.html">🌐 Public Website</a>
      <a href="#" id="logoutBtn" style="color:#e74c3c">🚪 Sign Out</a>
    </aside>

    <main class="portal-main">
      <div id="propertyContent">
        <p style="color:var(--brand-muted)">Loading property records...</p>
      </div>
    </main>
  </div>

  <script src="assets/js/site-config.js"></script>
  <script src="assets/js/components.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const content = document.getElementById('propertyContent');
      const money = (value) => window.Elpis && Elpis.money ? Elpis.money(value) : '₦' + Number(value || 0).toLocaleString('en-NG');
      const esc = (value) => String(value == null ? '' : value).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#039;');
      let portfolio = [];

      function card(item) {
        const images = item.images && item.images.length ? item.images : ['https://images.unsplash.com/photo-1600596542815-ffad4c1539a9?auto=format&fit=crop&w=1200&q=80'];
        const progress = Number(item.progress || 0);
        return `
          <article class="portfolio-property-card">
            <div class="portfolio-property-media">
              <img src="${images[0]}" alt="${esc(item.title)}" loading="lazy">
              <span class="status-badge status-available">${esc(item.status || 'Allocated')}</span>
            </div>
            <div class="portfolio-property-body">
              <div class="portfolio-property-head">
                <div>
                  <h2>${esc(item.title)}</h2>
                  <p>${esc(item.reference || '')} · ${esc(item.location || '')}${item.category_name ? ' · ' + esc(item.category_name) : ''}</p>
                </div>
                <a class="btn btn-outline btn-sm" href="property-details.html?id=${encodeURIComponent(item.property_id)}">View details →</a>
              </div>
              <div class="portfolio-property-metrics">
                <div><span>Agreed price</span><strong>${money(item.agreed_purchase_price)}</strong></div>
                <div><span>Verified paid</span><strong>${money(item.verified_ngn)}</strong></div>
                <div><span>Outstanding</span><strong>${money(item.outstanding_ngn)}</strong></div>
                <div><span>Progress</span><strong>${progress}%</strong></div>
              </div>
              <div class="portfolio-progress-track"><span style="width:${progress}%"></span></div>
              <p class="portfolio-property-foot">${item.verified_payments_count || 0} verified payment(s)${item.next_due_date ? ' · next due ' + esc(item.next_due_date) : ''}</p>
            </div>
          </article>`;
      }

      function renderAddForm(options) {
        if (!options.length) {
          return `<div class="portfolio-add-card" id="add-property">
            <h2>Add another property</h2>
            <p>Every published property is already in your portfolio or under review. Contact your advisor for private opportunities.</p>
          </div>`;
        }
        return `<div class="portfolio-add-card" id="add-property">
          <span class="kicker-tag">Grow your portfolio</span>
          <h2>${portfolio.length ? 'Add another property' : 'Add a property'}</h2>
          <p>${portfolio.length ? 'Choose another published property and send a request to your advisor. Your existing allocations stay unchanged.' : 'Choose a published property and send a request to your advisor to begin your portfolio.'}</p>
          <form id="addPropertyForm" class="portfolio-add-form">
            <label class="field-group">
              <span class="field-label">Property</span>
              <select class="field-input" id="additionalProperty" required>
                <option value="">Select a property</option>
                ${options.map(p => `<option value="${p.id}">${esc(p.title)}${p.city ? ' — ' + esc(p.city) : ''} (${money(p.sale_price)})</option>`).join('')}
              </select>
            </label>
            <label class="field-group">
              <span class="field-label">Note for your advisor (optional)</span>
              <textarea class="field-input" id="additionalNotes" rows="3" placeholder="Tell us what you are looking for, preferred payment structure or timeline."></textarea>
            </label>
            <button class="btn btn-gold" type="submit" id="additionalSubmit">Send request</button>
            <p id="addPropertyMsg" class="small muted" role="status"></p>
          </form>
        </div>`;
      }

      async function load() {
        try {
          const [portfolioRes, propertyRes] = await Promise.all([
            fetch('/api/client/dashboard', { credentials: 'include' }),
            fetch('/api/properties?limit=50', { credentials: 'same-origin' })
          ]);
          if (portfolioRes.status === 401 || portfolioRes.status === 403) { window.location.href = '/client-login.html'; return; }
          const data = await portfolioRes.json();
          portfolio = Array.isArray(data.properties) ? data.properties : [];
          const owned = new Set(portfolio.map(p => Number(p.property_id)));
          let options = [];
          if (propertyRes.ok) {
            const payload = await propertyRes.json();
            options = (payload.properties || []).filter(p => !owned.has(Number(p.id)));
          }
          content.innerHTML = `
            <div class="portfolio-page-head">
              <div>
                <h1>My Property Portfolio</h1>
                <p>Review every property in your portfolio and request another opportunity when you are ready.</p>
              </div>
              <span class="portfolio-count">${portfolio.length} propert${portfolio.length === 1 ? 'y' : 'ies'}</span>
            </div>
            ${portfolio.length ? portfolio.map(card).join('') : `<div class="empty-state"><h3>No property allocation yet</h3><p>Your advisor will add your first property after your purchase is confirmed.</p></div>`}
            ${renderAddForm(options)}`;
          const form = document.getElementById('addPropertyForm');
          if (form) {
            form.addEventListener('submit', async (event) => {
              event.preventDefault();
              const propertyId = document.getElementById('additionalProperty').value;
              const notes = document.getElementById('additionalNotes').value.trim();
              const msg = document.getElementById('addPropertyMsg');
              const button = document.getElementById('additionalSubmit');
              if (!propertyId) { msg.textContent = 'Choose a property first.'; return; }
              button.disabled = true; button.textContent = 'Sending request…'; msg.textContent = '';
              try {
                const res = await fetch('/api/client/property-requests', {
                  method: 'POST',
                  credentials: 'include',
                  headers: { 'Content-Type': 'application/json' },
                  body: JSON.stringify({ property_id: Number(propertyId), notes })
                });
                const result = await res.json().catch(() => ({}));
                if (!res.ok) throw new Error(result.error || 'Unable to send request.');
                msg.textContent = result.message || 'Request sent. Your advisor will contact you.';
                document.getElementById('additionalProperty').value = '';
                document.getElementById('additionalNotes').value = '';
                button.textContent = 'Request sent';
              } catch (error) {
                msg.textContent = error.message;
                button.disabled = false; button.textContent = 'Send request';
              }
            });
          }
        } catch (error) {
          content.innerHTML = `<div class="empty-state"><h3>Unable to load your portfolio</h3><p>${esc(error.message)}</p></div>`;
        }
      }

      document.getElementById('logoutBtn').addEventListener('click', async (e) => {
        e.preventDefault();
        await fetch('/api/logout', { method: 'POST' });
        window.location.href = '/client-login.html';
      });

      await load();
    });
  </script>  </script>
  <script src="assets/js/mobile-nav.js"></script>
  <script src="assets/js/pwa.js"></script>
</body>
</html>
